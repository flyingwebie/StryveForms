name: StryveForms

# Local/self-hosted stack: web app on http://localhost:3002, which forwards
# /api and /trpc to the API server over the private network.
# Settings come from apps/server/.env (see apps/server/.env.example).

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      SERVER_URL: http://server:3000
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true
    env_file:
      - path: apps/server/.env
        required: false
    environment:
      APP_URL: ${APP_URL:-http://localhost:3002}
      BETTER_AUTH_URL: ${APP_URL:-http://localhost:3002}
      CORS_ORIGIN: ${APP_URL:-http://localhost:3002}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/StryveForms
      STORAGE_PATH: /data/storage
      TRUST_PROXY: "true"
    volumes:
      - StryveForms_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: StryveForms-postgres
    environment:
      POSTGRES_DB: StryveForms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - StryveForms_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  StryveForms_postgres_data:
  StryveForms_storage:
