name: Bug report
description: Something isn't working the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search [existing issues](../../issues) first to avoid duplicates.
        For a security vulnerability, please follow [SECURITY.md](../../blob/main/SECURITY.md) instead of filing a public issue.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If this is a UI bug, a screenshot (light and/or dark mode) makes it much faster to diagnose.

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: The StryveForms version, Docker image tag, or git commit you're running.
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running StryveForms?
      options:
        - Coolify (Docker Compose)
        - Coolify (Railpack)
        - Railway
        - Docker Compose on a VPS
        - Dokploy
        - CapRover
        - Render
        - Fly.io
        - Local development (bun run dev)
        - Other (describe below)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser + OS for a UI bug; Postgres/Bun version for a server bug; anything else relevant.

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server log output, browser console errors, or stack traces. This will be rendered as a code block automatically.
      render: shell
