# Release: bump "version" in package.json and merge to main. This workflow
# then tags the commit (v<version>), builds the web and server images for
# linux/amd64 + linux/arm64, publishes them to GitHub Container Registry, and
# creates the GitHub Release. Pushing a v*.*.* tag by hand works too.
#
# Tagging happens here rather than in a separate workflow because tags pushed
# with GITHUB_TOKEN don't trigger other workflows.
#
#   ghcr.io/<owner>/stryveforms-web:<version> | <major>.<minor> | <major> | latest
#   ghcr.io/<owner>/stryveforms-server:<version> | …
#
# docker-compose.coolify.yaml pulls these images (STRYVEFORMS_VERSION pins one).
name: Release

on:
  push:
    branches:
      - main
    # Only the version bump matters on main; path filters don't apply to tags.
    paths:
      - package.json
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and release, e.g. v1.0.0"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      owner: ${{ steps.version.outputs.owner }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: version
        name: Resolve the tag to release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_TYPE" = "branch" ] && [ -z "$INPUT_TAG" ]; then
            # Push to main that touched package.json: release only if the
            # version is new (other edits to package.json are ignored).
            tag="v$pkg"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists; nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
            if [ "${tag#v}" != "$pkg" ]; then
              echo "::error::Tag $tag doesn't match package.json version $pkg. Bump package.json first."
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Create the tag
        if: steps.version.outputs.release == 'true' && github.ref_type == 'branch' && !inputs.tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

  build:
    name: Build ${{ matrix.app }} (${{ matrix.platform }})
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        app: [web, server]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Platform slug
        run: echo "PLATFORM_SLUG=${{ matrix.platform }}" | sed 's#/#-#g' >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/stryveforms-${{ matrix.app }}
          labels: |
            org.opencontainers.image.title=StryveForms ${{ matrix.app }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      # Pushed by digest only; the merge job below adds the version tags once
      # both architectures are built.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/stryveforms-${{ matrix.app }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.app }}-${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ env.PLATFORM_SLUG }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.app }}-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.app }} image
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [web, server]
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/stryveforms-${{ matrix.app }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
            type=raw,value=latest

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046 # tag flags and digests are meant to split
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ needs.prepare.outputs.version }}"

  release:
    name: GitHub Release
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Release notes
        run: |
          version="${{ needs.prepare.outputs.version }}"
          owner="${{ needs.prepare.outputs.owner }}"
          cat > /tmp/notes.md <<EOF
          ## Docker images

          \`\`\`
          ghcr.io/${owner}/stryveforms-web:${version}
          ghcr.io/${owner}/stryveforms-server:${version}
          \`\`\`

          Multi-arch (linux/amd64, linux/arm64). Also tagged \`${version%.*}\`, \`${version%%.*}\` and \`latest\`.

          ## Deploy

          Use the attached \`docker-compose.coolify.yaml\` (Coolify: Docker Compose resource), or any
          Docker Compose host. Set \`STRYVEFORMS_VERSION=${version}\` to pin this release.
          Database migrations run automatically when the server container starts.

          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" docker-compose.coolify.yaml --clobber
          else
            gh release create "$TAG" docker-compose.coolify.yaml \
              --title "StryveForms ${{ needs.prepare.outputs.version }}" \
              --notes-file /tmp/notes.md \
              --generate-notes \
              --verify-tag
          fi
