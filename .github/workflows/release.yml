# Release: push a version tag (git tag v1.0.0 && git push origin v1.0.0) to
# build the web and server images for linux/amd64 + linux/arm64, publish them
# to GitHub Container Registry, and create the GitHub Release.
#
#   ghcr.io/<owner>/stryveforms-web:<version> | <major>.<minor> | <major> | latest
#   ghcr.io/<owner>/stryveforms-server:<version> | …
#
# docker-compose.coolify.yaml pulls these images (STRYVEFORMS_VERSION pins one).
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and release, e.g. v1.0.0"
        required: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      owner: ${{ steps.version.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: version
        name: Tag must match package.json
        run: |
          tag="${TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag doesn't match package.json version $pkg. Bump package.json first."
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.app }} (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        app: [web, server]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Platform slug
        run: echo "PLATFORM_SLUG=${{ matrix.platform }}" | sed 's#/#-#g' >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/stryveforms-${{ matrix.app }}
          labels: |
            org.opencontainers.image.title=StryveForms ${{ matrix.app }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      # Pushed by digest only; the merge job below adds the version tags once
      # both architectures are built.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.prepare.outputs.owner }}/stryveforms-${{ matrix.app }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.app }}-${{ env.PLATFORM_SLUG }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ env.PLATFORM_SLUG }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.app }}-${{ env.PLATFORM_SLUG }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.app }} image
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        app: [web, server]
    env:
      IMAGE: ghcr.io/${{ needs.prepare.outputs.owner }}/stryveforms-${{ matrix.app }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
            type=raw,value=latest

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046 # tag flags and digests are meant to split
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ needs.prepare.outputs.version }}"

  release:
    name: GitHub Release
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Release notes
        run: |
          version="${{ needs.prepare.outputs.version }}"
          owner="${{ needs.prepare.outputs.owner }}"
          cat > /tmp/notes.md <<EOF
          ## Docker images

          \`\`\`
          ghcr.io/${owner}/stryveforms-web:${version}
          ghcr.io/${owner}/stryveforms-server:${version}
          \`\`\`

          Multi-arch (linux/amd64, linux/arm64). Also tagged \`${version%.*}\`, \`${version%%.*}\` and \`latest\`.

          ## Deploy

          Use the attached \`docker-compose.coolify.yaml\` (Coolify: Docker Compose resource), or any
          Docker Compose host. Set \`STRYVEFORMS_VERSION=${version}\` to pin this release.
          Database migrations run automatically when the server container starts.

          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" docker-compose.coolify.yaml --clobber
          else
            gh release create "$TAG" docker-compose.coolify.yaml \
              --title "StryveForms ${{ needs.prepare.outputs.version }}" \
              --notes-file /tmp/notes.md \
              --generate-notes \
              --verify-tag
          fi
