# StryveForms on Coolify (https://coolify.io)
#
# Uses the prebuilt images published by GitHub Actions on every release
# (ghcr.io/flyingwebie/stryveforms-web and -server), so nothing is built on
# your server. Pin a version with STRYVEFORMS_VERSION (e.g. 1.0.0, or 1 to
# follow 1.x); it defaults to "latest".
#
# 1. In Coolify: New Resource → Docker Compose Empty, paste this file (or
#    Public Repository → Build Pack "Docker Compose", Docker Compose Location:
#    /docker-compose.coolify.yaml).
# 2. Domains: Coolify gives the "web" service a domain automatically (from your
#    server's wildcard domain), routed to container port 3002. Change it any time
#    under Domains (e.g. https://forms.example.com:3002 — the ":3002" only picks
#    the container port). "server" and "postgres" stay private.
#    The server reads the URL from SERVICE_URL_WEB, which Coolify keeps in sync
#    with that domain (scheme + host, no port) on every deploy.
# 3. Fill in the optional SMTP / storage / captcha variables, then Deploy.
# 4. Open your domain: the first visit starts the onboarding (create the admin account).
#
# Secrets (database password, auth secret) are generated by Coolify automatically.

services:
  web:
    image: ghcr.io/flyingwebie/stryveforms-web:${STRYVEFORMS_VERSION:-latest}
    environment:
      # Coolify routes the public domain to port 3002 of this container.
      SERVICE_URL_WEB_3002: /
      NODE_ENV: production
      PORT: 3002
      HOST: 0.0.0.0
      # The web app forwards /api and /trpc to the API over the private network.
      SERVER_URL: http://server:3000
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3002/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  server:
    image: ghcr.io/flyingwebie/stryveforms-server:${STRYVEFORMS_VERSION:-latest}
    environment:
      NODE_ENV: production
      APP_NAME: ${APP_NAME:-StryveForms}
      # Everything is served from the web domain (the web app proxies the API).
      # SERVICE_URL_WEB is the web service's domain from Coolify's Domains
      # table, kept in sync on each deploy. Don't use SERVICE_URL_WEB_3002 here:
      # Coolify appends ":3002" to it, which breaks sign-in and CORS.
      APP_URL: ${SERVICE_URL_WEB}
      BETTER_AUTH_URL: ${SERVICE_URL_WEB}
      CORS_ORIGIN: ${SERVICE_URL_WEB}
      BETTER_AUTH_SECRET: ${SERVICE_BASE64_64_AUTH}
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-stryveforms}
      # Respondent IPs arrive through Coolify's proxy and the web app.
      TRUST_PROXY: "true"

      # File storage: "local" keeps uploads in the stryveforms-storage volume,
      # "s3" uses any S3-compatible bucket (AWS, Cloudflare R2, MinIO…).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_PATH: /data/storage
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}

      # Outgoing email. Leave SMTP_HOST empty to only log emails.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-StryveForms <no-reply@example.com>}

      # Optional captcha. Site keys are public and sent to the browser with
      # each form at runtime, so they work with the prebuilt images.
      HCAPTCHA_SITE_KEY: ${HCAPTCHA_SITE_KEY:-}
      HCAPTCHA_SECRET_KEY: ${HCAPTCHA_SECRET_KEY:-}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}

      # Optional integrations
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      OPNFORM_IMPORT_RATE_LIMIT: ${OPNFORM_IMPORT_RATE_LIMIT:-60}
      # Largest workspace export / instance backup file you can upload (MB).
      BACKUP_MAX_UPLOAD_MB: ${BACKUP_MAX_UPLOAD_MB:-20480}
      # Passkeys: leave empty to use your domain's hostname. Only set this if
      # a proxy rewrites the host (changing it later invalidates passkeys).
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
    volumes:
      - stryveforms-storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: ${POSTGRES_DB:-stryveforms}
    volumes:
      - stryveforms-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  stryveforms-storage:
  stryveforms-postgres:
